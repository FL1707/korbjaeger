<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Korbjäger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korbjäger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: Sport-App für Kinder – Kopfzeile mit Logo, Inhalte in Karten-Rastern, feste Tab-Leiste unten wie auf dem iPad gewohnt. */
:root {
  --bg: #EEF3F9;
  --surface: #FFFFFF;
  --surface-2: #E2EAF4;
  --ink: #12203A;
  --ink-soft: #4E5E78;
  --line: #CFDAE8;
  --orange: #FF6A13;
  --orange-ink: #C94A00;
  --teal: #00A99B;
  --yellow: #FFCF33;
  --good: #18A058;
  --warn: #E8A400;
  --bad: #D9364A;
  --court: #F2A65A;
  --shadow: 0 2px 0 rgba(18,32,58,.08), 0 8px 24px -12px rgba(18,32,58,.25);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1525; --surface: #172238; --surface-2: #213050; --ink: #F1F5FB; --ink-soft: #A7B5CC;
  --line: #2B3B5C; --orange: #FF7A2E; --orange-ink: #FF9A5C; --teal: #2CD3C3; --yellow: #FFD54F;
  --good: #3DD07E; --warn: #F5BE2E; --bad: #FF6B7D; --court: #B9773A;
  --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1525; --surface: #172238; --surface-2: #213050; --ink: #F1F5FB; --ink-soft: #A7B5CC;
  --line: #2B3B5C; --orange: #FF7A2E; --orange-ink: #FF9A5C; --teal: #2CD3C3; --yellow: #FFD54F;
  --good: #3DD07E; --warn: #F5BE2E; --bad: #FF6B7D; --court: #B9773A;
  --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; text-wrap: balance; margin: 0; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* Kopfzeile */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: #fff;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:root:not([data-theme="light"]) .top { }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: #fff; }
.logo svg { width: 38px; height: 38px; flex: none; }
.logo b { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 30px; letter-spacing: .5px; }
.logo b span { color: var(--yellow); }
.stamp { margin-left: auto; text-align: right; font-size: 13px; line-height: 1.25; color: #C9D4E6; }
.stamp strong { display: block; color: #fff; font-size: 14px; }

main { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 28px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { font-size: 30px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .3px; }
.sec-h p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.hello { font-size: 15px; color: var(--ink-soft); margin: 0; }
.hello b { color: var(--ink); }

/* Tab-Leiste */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
.tab { background: none; border: 0; padding: 8px 2px 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.tab svg { width: 28px; height: 28px; }
.tab[aria-selected="true"] { color: var(--orange-ink); }
.tab[aria-selected="true"] .ic-bg { fill: var(--orange); opacity: .18; }

/* Karten */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill.nba { background: #1D428A; color: #fff; } .pill.bbl { background: #E30613; color: #fff; }
.pill.el { background: #F27A1A; color: #12203A; } .pill.bcl { background: #0A2C78; color: #FFD400; } .pill.dbb { background: #12203A; color: #FFCE00; }
.pill.en { background: var(--teal); color: #fff; }
.pill.fav { background: var(--yellow); color: #12203A; }
.pill.legacy { background: #6B4E16; color: #FFE7A8; justify-self: start; }

/* Highlights oben */
.hero-row { display: grid; gap: 14px; grid-template-columns: 1.2fr 1fr; }
@media (max-width: 760px) { .hero-row { grid-template-columns: 1fr; } }
.zahl { background: var(--orange); color: #fff; border-radius: var(--r); padding: 20px 22px; display: grid; gap: 6px; align-content: start; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.zahl .lbl { font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; opacity: .9; }
.zahl .big { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: clamp(64px, 12vw, 104px); line-height: .9; }
.zahl p { margin: 0; font-size: 17px; font-weight: 700; max-width: 34ch; position: relative; }
.zahl svg { position: absolute; right: -30px; bottom: -40px; width: 180px; height: 180px; opacity: .22; }
.next { display: grid; gap: 10px; }
.next-card { padding: 14px 16px; display: grid; gap: 8px; }
.next-card .when { font-size: 14px; font-weight: 800; color: var(--orange-ink); }
.vs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 800; }
.vs .at { color: var(--ink-soft); font-weight: 700; font-size: 14px; }

/* Aufgefallen: auffällige Spieler und besondere Spiele mit Begründung */
.hl-card { text-align: left; border: 0; border-top: 6px solid var(--orange); padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.hl-card.spiel { border-top-color: var(--teal); }
.hl-card .hl-who { display: flex; align-items: center; gap: 8px; font-weight: 800; line-height: 1.2; }
.hl-card .hl-wert { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 40px; line-height: .95; color: var(--orange-ink); }
.hl-card.spiel .hl-wert { color: var(--teal); }
.hl-card .hl-why { margin: 0; font-size: 15px; }
.hl-card .hl-why b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); }
.hl-card .more { font-size: 13px; font-weight: 800; color: var(--orange-ink); }

.badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .3px; border: 3px solid; }
.badge.sm { width: 32px; height: 32px; font-size: 12px; border-width: 2px; }

/* News */
.news-top { display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; text-align: left; border: 0; padding: 0; }
@media (max-width: 760px) { .news-top { grid-template-columns: 1fr; } }
.news-top .art { min-height: 220px; }
.news-top .txt { padding: 20px; display: grid; gap: 10px; align-content: start; }
.news-top h3 { font-size: 34px; font-weight: 800; }
.news-card { text-align: left; border: 0; padding: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.news-card .art { height: 130px; }
.news-card .txt { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.news-card h3 { font-size: 24px; font-weight: 800; }
.teaser { margin: 0; color: var(--ink-soft); font-size: 16px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.art { position: relative; overflow: hidden; display: grid; place-items: center; }
.art svg { width: 100%; height: 100%; display: block; }

/* Artikel-Ansicht */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.reader-bar { position: sticky; top: 0; z-index: 2; background: var(--ink); color: #fff; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.reader-bar button { background: rgba(255,255,255,.12); border: 0; color: #fff; font-weight: 800; padding: 8px 14px 8px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.reader article { max-width: 720px; margin: 0 auto; padding-block: 0 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.reader .art { height: 220px; border-radius: 0 0 var(--r) var(--r); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
@media (min-width: 760px) { .reader .art { margin: 16px 0 0; border-radius: var(--r); } }
.reader h1 { font-size: clamp(34px, 6vw, 48px); font-weight: 800; }
.reader .body p { margin: 0 0 14px; font-size: 19px; line-height: 1.65; max-width: 62ch; }
.facts { background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; border: 2px dashed var(--line); }
.facts h4, .vocab h4 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; text-transform: uppercase; font-style: italic; }
.facts ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.vocab { background: var(--teal); color: #fff; border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; }
.vocab dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.vocab dt { font-weight: 800; } .vocab dd { margin: 0; }
.src { font-size: 13px; color: var(--ink-soft); }
.term { background: none; border: 0; padding: 0; font-weight: 800; color: var(--orange-ink); text-decoration: underline dotted 2px; text-underline-offset: 3px; }

/* Begriffs-Blase */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 560px; margin: 0 auto 16px; background: var(--ink); color: #fff; border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.sheet-in b { font-family: var(--font-display); font-size: 26px; font-style: italic; }
.sheet-in .en { color: var(--yellow); font-weight: 800; font-size: 14px; }
.sheet-in button { justify-self: end; background: var(--orange); border: 0; color: #fff; font-weight: 800; padding: 6px 16px; border-radius: 999px; }

/* Ergebnisse */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.game { padding: 12px 14px; display: grid; gap: 6px; }
.game.fav { outline: 3px solid var(--yellow); }
.game-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink-soft); gap: 8px; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.row .tn { font-weight: 700; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.row .sc { font-family: var(--font-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.row.win .tn { font-weight: 800; } .row.win .sc { color: var(--ink); }
.game .note { font-size: 14px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 6px; }
button.game { text-align: left; border: 0; width: 100%; }
.game .more { font-size: 13px; font-weight: 800; color: var(--orange-ink); justify-self: end; white-space: nowrap; }
/* Kompakte Ergebnis-Boxen in der Liste (der Spielbericht nutzt weiter die großen Zeilen) */
.games .game { padding: 12px 14px; gap: 4px; }
.games .game-h { font-size: 12px; }
.games .row { gap: 8px; }
.games .row .sc { font-size: 28px; line-height: 1; }
.games .badge { width: 30px; height: 30px; font-size: 11px; border-width: 2px; }
.game-f { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
.game-f .note { border: 0; padding: 0; font-size: 13px; line-height: 1.3; }
/* Spielbericht */
.box-score { padding: 16px 18px; display: grid; gap: 8px; margin-top: 16px; }
.box-score .row .sc { font-size: 48px; }
.box-score .row .tn { font-size: 19px; }
.box-score .badge { width: 52px; height: 52px; font-size: 17px; }
.day-h { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--ink-soft); letter-spacing: .4px; margin-top: 6px; }
.sched { display: grid; gap: 8px; }
.sched-row { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; }
@media (max-width: 520px) { .sched-row { grid-template-columns: 1fr; gap: 6px; } }
.sched-row .t { font-weight: 800; line-height: 1.2; } .sched-row .t small { display: block; color: var(--ink-soft); font-weight: 700; }

/* Tabellen */
.tv { display: inline-block; vertical-align: middle; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 800; line-height: 1.3; letter-spacing: .02em; }
.tv-dyn { background: #0B0B0B; color: #fff; text-transform: lowercase; }
.tv-prime { background: #00A8E1; color: #fff; font-style: italic; text-transform: lowercase; }
.tbl-wrap { overflow-x: auto; }
.serie { padding: 12px 14px; display: grid; gap: 6px; }
.serie .row { display: flex; align-items: center; gap: 10px; }
.serie .tn { flex: 1; font-weight: 700; }
.serie .fav-star { margin-left: 0; font-size: 18px; }
.serie .sc { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--ink-soft); min-width: 22px; text-align: right; }
.serie .row.win .tn { font-weight: 800; } .serie .row.win .sc { color: var(--ink); }
.serie-f { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
/* Spielfeld-Skizze */
.feld { margin: 4px 0; max-width: 420px; }
.feld svg { width: 100%; height: auto; display: block; border-radius: 14px; }
.f-boden { fill: color-mix(in srgb, var(--court) 30%, var(--surface)); stroke: none; }
.f-linie * { fill: none; stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: .7; }
.feld line { stroke: var(--ink); stroke-width: .9; stroke-linecap: round; }
.f-spitze { fill: var(--ink); }
.f-sp circle { stroke: #fff; stroke-width: .6; }
.f-sp.a circle { fill: #1D6FD8; } .f-sp.b circle { fill: #D9364A; }
.f-sp text { fill: #fff; font-size: 4.4px; font-weight: 800; text-anchor: middle; font-family: inherit; }
.f-ball { fill: var(--orange); stroke: #7A3300; stroke-width: .5; }
.feld figcaption { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-top: 6px; }
.f-leg::before { content: ""; display: inline-block; vertical-align: middle; margin-right: 5px; }
.f-leg.a::before, .f-leg.b::before { width: 11px; height: 11px; border-radius: 50%; background: #1D6FD8; }
.f-leg.b::before { background: #D9364A; }
.f-leg.l-lauf::before { width: 16px; border-top: 2px solid var(--ink); }
.f-leg.l-pass::before { width: 16px; border-top: 2px dashed var(--ink); }
.f-leg.l-dribbel::before { width: 16px; border-top: 2px dotted var(--ink); }
/* Training */
.uebung { padding: 18px 20px; display: grid; gap: 12px; max-width: 760px; }
.uebung h3 { font-size: 30px; font-weight: 800; }
.uebung h4 { margin: 4px 0 -4px; font-size: 18px; font-weight: 800; }
.schritte { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }
.schritte li::marker { font-weight: 800; color: var(--orange-ink); }
.stufen { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stufe { border-radius: 12px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 2px; border-left: 5px solid var(--good); }
.stufe.mittel { border-left-color: var(--warn); } .stufe.schwer { border-left-color: var(--bad); }
.stufe b, .stufe span { font-size: 15px; }
.fehler { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.fehler li::marker { content: "✗  "; color: var(--bad); font-weight: 800; }
.frueher { padding: 0; margin-bottom: 10px; }
.frueher summary { padding: 14px 18px; font-weight: 800; font-size: 17px; cursor: pointer; }
.frueher .uebung { box-shadow: none; padding-top: 0; }
/* Schiri-Situation */
.schiri .situation { margin: 0; font-size: 18px; }
.grp-h { font-size: 22px; font-weight: 800; font-style: italic; text-transform: uppercase; margin: 6px 0 -4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); text-align: right; padding: 10px 10px; font-weight: 800; }
th:nth-child(2) { text-align: left; }
td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; font-weight: 700; white-space: nowrap; }
td:first-child { width: 44px; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; border-left: 5px solid transparent; }
td.team { text-align: left; white-space: normal; }
td.team div { display: flex; align-items: center; gap: 10px; }
tr.z-good td:first-child { border-left-color: var(--good); }
tr.z-warn td:first-child { border-left-color: var(--warn); }
tr.z-bad td:first-child { border-left-color: var(--bad); }
tr.fav td { background: color-mix(in srgb, var(--yellow) 22%, transparent); }
/* Kompakte Zeilen im Tab „Tabellen“ */
.stand td { padding-top: 4px; padding-bottom: 4px; line-height: 1.2; }
.stand td:first-child { font-size: 17px; }
.stand td.team div { gap: 8px; }
.stand .badge.sm { width: 24px; height: 24px; font-size: 9px; border-width: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); font-weight: 700; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* Stars */
/* Stern zum Markieren von Lieblingsteams und -spielern */
.fav-star { border: 0; background: none; padding: 2px 6px; margin-left: auto; font-size: 22px; line-height: 1; color: var(--ink-soft); cursor: pointer; flex: none; }
.fav-star.on { color: #F5B400; }
.fav-list { padding: 6px 14px; }
.fav-team { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-weight: 800; font-size: 17px; }
.fav-team + .fav-team { border-top: 1px solid var(--line); }
.link { border: 0; background: none; padding: 0; font: inherit; font-weight: 800; color: var(--orange-ink); text-decoration: underline; cursor: pointer; }

.quiz { padding: 20px; display: grid; gap: 14px; max-width: 720px; }
.quiz .prog { display: flex; gap: 6px; }

.answers button.ok { background: var(--good); border-color: var(--good); color: #fff; }
.answers button.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.answers button:disabled { cursor: default; }
.expl { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
.btn { justify-self: start; background: var(--orange); color: #fff; border: 0; font-weight: 800; padding: 10px 22px; border-radius: 999px; font-size: 17px; }
.score { font-family: var(--font-display); font-size: 72px; font-weight: 800; font-style: italic; line-height: 1; }

  /* Ohne eigenen Bericht entsteht eine Kurzfassung nur aus gesicherten Daten: Ergebnis, Runde und Topscorer */

  /* Upcoming: alle kommenden Spiele aller Ligen, nach Tagen in deutscher Zeit gruppiert */

    const s = D.schiri; if (!s || !(s.antworten || []).length) return "";
    const key = "schiri_" + (s.id || D.aktualisiert), pick = store.get(key, null), done = pick != null;
    const REGEL = { beide: "NBA und FIBA", NBA: "NBA", FIBA: "FIBA (Bundesliga, Europa)" };
    return '<section class="sec"><div class="sec-h"><h2>Was würdest du pfeifen?</h2><p>Jeden Tag eine neue Situation für den Schiri in dir</p></div><div class="card quiz schiri">' +
      (s.regel ? '<span class="pill">Regel: ' + esc(REGEL[s.regel] || s.regel) + "</span>" : "") + (s.titel ? "<h3>" + esc(s.titel) + "</h3>" : "") +
      '<p class="situation">' + linkTerms(s.situation || "") + "</p>" + feld(s.skizze) + (s.frage ? "<b>" + esc(s.frage) + "</b>" : "") +
      '<div class="answers">' + s.antworten.map((a, i) => '<button data-schiri="' + i + '"' + (done ? " disabled" : "") + ' class="' + (done ? (i === s.richtig ? "ok" : i === pick ? "no" : "") : "") + '">' + esc(a) + "</button>").join("") + "</div>" +
      (done ? '<p class="expl">' + (pick === s.richtig ? "Richtig gepfiffen! " : "Knapp daneben. ") + esc(s.erklaerung || "") + "</p>" + (s.unterschied ? '<p class="teaser"><b>NBA oder FIBA?</b> ' + esc(s.unterschied) + "</p>" : "") : "") + "</div></section>";
  }
  function vQuiz() { return '<div class="view">' + quizSec() + schiriSec() + "</div>"; }
  function quizSec() {
    const Q = D.quiz || [];
    const key = "quiz_" + (D.quizId || D.aktualisiert);
    const st = store.get(key, { i: 0, picks: [] });
    if (!Q.length) return '<section class="sec"><div class="card empty">Heute gibt es noch kein Quiz. Schau morgen früh wieder vorbei!</div></section>';
    const prog = '<div class="prog">' + Q.map((q, i) => '<i class="' + (i < st.picks.length ? (st.picks[i] === q.richtig ? "ok" : "no") : i === st.i ? "cur" : "") + '"></i>').join("") + "</div>";
    if (st.i >= Q.length) {
      const pts = st.picks.filter((p, i) => p === Q[i].richtig).length;
      const msg = pts === Q.length ? "Perfekt! Du bist ein echter Basketball-Profi." : pts >= Q.length / 2 ? "Stark! Du kennst dich richtig gut aus." : "Gut gemacht! Lies die News und versuch es nochmal.";
      return '<section class="sec"><div class="sec-h"><h2>Tagesquiz</h2></div><div class="card quiz">' + prog + '<span class="score">' + pts + " von " + Q.length + "</span><p style=\"margin:0;font-weight:800\">" + msg + '</p><button class="btn" data-quiz="reset">Nochmal spielen</button></div></section>';
    }
    const q = Q[st.i], answered = st.picks.length > st.i, pick = st.picks[st.i];
    return '<section class="sec"><div class="sec-h"><h2>Tagesquiz</h2><p>Frage ' + (st.i + 1) + " von " + Q.length + '</p></div><div class="card quiz">' + prog + (q.art === "legacy" ? '<span class="pill legacy">NBA-Geschichte' + (q.jahr ? " · " + esc(q.jahr) : "") + "</span>" : "") + "<h3>" + esc(q.frage) + '</h3><div class="answers">' +
      q.antworten.map((a, i) => '<button data-ans="' + i + '"' + (answered ? " disabled" : "") + ' class="' + (answered ? (i === q.richtig ? "ok" : i === pick ? "no" : "") : "") + '">' + esc(a) + "</button>").join("") + "</div>" +
      (answered ? '<p class="expl">' + (pick === q.richtig ? "Richtig! " : "Leider falsch. ") + esc(q.erklaerung || "") + '</p><button class="btn" data-quiz="next">' + (st.i + 1 < Q.length ? "Nächste Frage" : "Ergebnis zeigen") + "</button>" : "") + "</div></section>";
  }
  function stFmt(v, k) {
    if (v == null) return "–";
    const s = ["alter", "sp", "s", "n", "dd2", "td3"].includes(k) ? String(Math.round(v)) : v.toFixed(1).replace(".", ",");
    return k === "pm" && v > 0 ? "+" + s : s;
  }
  function statsAktuell() { return S; }
  function loadSaison(x) {
    stSaison = x; stLimit = 50; render();
    if (!x || SC[x]) return;
    fetch("nba-stats-" + x + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => { if (j && Array.isArray(j.spieler)) SC[x] = j; else stSaison = ""; render(); }).catch(() => { stSaison = ""; render(); });
  }
  function vStatistik() {
    const akt = statsAktuell(), S = stSaison ? SC[stSaison] : akt;
    const saisons = akt && SX.length ? '<label class="st-saison">Saison <select id="st-saison" aria-label="Saison wählen">' + [""].concat(SX).map(x => '<option value="' + x + '"' + (x === stSaison ? " selected" : "") + ">" + (x ? esc(x) : esc(akt.saison) + " (aktuell)") + "</option>").join("") + "</select></label>" : "";
    if (!S) return '<div class="view"><section class="sec"><div class="sec-h"><h2>NBA-Statistiken</h2></div>' + saisons + '<div class="card empty">Die NBA-Statistiken werden geladen …</div></section></div>';
    const idx = {}; S.spalten.forEach((k, i) => { idx[k] = i; });
    const st = D.stars || [], de = new Set(st.filter(p => p.deutsch).map(p => p.name)), fav = new Set(favP);
    const q = stQuery.trim().toLowerCase(), k = idx[stSort];
    const rows = S.spieler.filter(r => (stFilter === "alle" || (stFilter === "de" ? de.has(r[0]) : fav.has(r[0]))) && (!q || (r[0] + " " + r[1] + " " + team(r[1]).name).toLowerCase().includes(q)))
      .sort((a, b) => stDir * ((a[k] == null ? -1e9 : a[k]) - (b[k] == null ? -1e9 : b[k])));
    const show = q || stFilter !== "alle" ? rows : rows.slice(0, stLimit);
    const cols = stAll ? ST_COLS : ST_COLS.filter(c => ST_SHORT.includes(c[0]));
    const flag = '<svg width="18" height="12" viewBox="0 0 3 2" aria-label="Deutscher Spieler"><rect width="3" height="2" fill="#000"/><rect y=".667" width="3" height=".667" fill="#D00"/><rect y="1.333" width="3" height=".667" fill="#FFCE00"/></svg>';
    const chip = (attr, val, label, on) => "<button " + attr + '="' + val + '" aria-pressed="' + on + '">' + label + "</button>";
    return '<div class="view"><section class="sec"><div class="sec-h"><h2>NBA-Statistiken</h2><p>Saison ' + esc(S.saison) + " · " + esc(S.art) + " · " + (stSaison ? "abgeschlossene Saison" : "Stand: " + fmtDate(S.stand)) + "</p></div>" + saisons +
      '<div class="seg">' + ST_SORT.map(x => chip("data-st-sort", x[0], x[1], x[0] === stSort)).join("") + "</div>" +
      '<div class="st-tools"><div class="seg">' + chip("data-st-filter", "alle", "Alle Spieler", stFilter === "alle") + chip("data-st-filter", "de", "Deutsche", stFilter === "de") + chip("data-st-filter", "fav", "Deine Stars", stFilter === "fav") + "</div>" +
      '<div class="seg">' + chip("data-st-all", "1", stAll ? "Weniger Spalten" : "Alle Spalten", stAll) + "</div></div>" +
      '<input class="search" id="stq" type="search" placeholder="Spieler oder Team suchen, z. B. Curry" value="' + esc(stQuery) + '" aria-label="Spieler suchen">' +
      '<div class="card tbl-wrap"><table class="stbl"><thead><tr><th class="nm">Spieler</th>' +
      cols.map(c => '<th><button class="sth" data-st-sort="' + c[0] + '" aria-pressed="' + (c[0] === stSort) + '" title="' + esc(c[2]) + '">' + esc(c[1]) + (c[0] === stSort ? (stDir < 0 ? " ▾" : " ▴") : "") + "</button></th>").join("") + "</tr></thead><tbody>" +
      (show.length ? show.map((r, i) => '<tr class="' + (fav.has(r[0]) ? "fav" : "") + '"><td class="nm"><div><span class="rk">' + (i + 1) + "</span>" + badge(r[1], true) + "<span><b>" + esc(r[0]) + (de.has(r[0]) ? flag : "") + "</b><small>" + esc(team(r[1]).name) + "</small></span>" + starBtn("data-fav-spieler", r[0], fav.has(r[0]), r[0]) + "</div></td>" +
        cols.map(c => "<td" + (c[0] === stSort ? ' class="on"' : "") + ">" + stFmt(r[idx[c[0]]], c[0]) + "</td>").join("") + "</tr>").join("") : '<tr><td class="nm">Keinen Spieler gefunden.</td></tr>') +
      "</tbody></table></div>" +
      (rows.length > show.length ? '<button class="btn" data-st-more>Mehr anzeigen (' + (rows.length - show.length) + " weitere)</button>" : "") +
      '<details class="card abbr"><summary>Was bedeuten die Abkürzungen?</summary><dl>' + ST_COLS.map(c => "<dt>" + esc(c[1]) + "</dt><dd>" + esc(c[2]) + "</dd>").join("") + "</dl></details>" +
      '<p class="foot">Quelle: ' + esc(S.quelle) + ". Tippe auf eine Spalte, um danach zu sortieren. Die Tabelle kannst du zur Seite wischen.</p></section></div>";
  }
  /* Aktuelle Artikel plus Archiv (archiv.json); bei gleicher id gewinnt die aktuelle Fassung */
  function allNews() {
    const seen = new Set(), out = [];
    (D.news || []).concat(A).forEach(n => { if (n && n.id && !seen.has(n.id)) { seen.add(n.id); out.push(n); } });
    return out;
  }
  function vLiga() {
    if (ligaSel !== "ALLE" && !LIGA_MENU[ligaSel]) ligaSel = "ALLE";
    const isAll = ligaSel === "ALLE", c = LIGA_DOT[ligaSel] || ["#FF6A13", "#fff", "", "#12203A"];
    const cur = new Set((D.news || []).map(n => n.id));
    const list = allNews().filter(n => isAll || n.liga === ligaSel).sort((a, b) => String(b.datum || "").localeCompare(String(a.datum || "")));
    const neu = list.filter(n => cur.has(n.id)), groups = {};
    list.filter(n => !cur.has(n.id)).forEach(n => { const d = new Date(n.datum + "T12:00:00"); const k = isNaN(d) ? "Ältere Artikel" : MON[d.getMonth()] + " " + d.getFullYear(); (groups[k] = groups[k] || []).push(n); });
    const tbl = LIGA_TBL[ligaSel];
    const links = isAll ? "" : '<div class="seg"><button data-goto-res="' + ligaSel + '">Ergebnisse</button><button data-goto-up="' + ligaSel + '">Upcoming</button>' + (tbl && (D.tabellen || {})[tbl] ? '<button data-goto-tbl="' + tbl + '">Tabelle</button>' : "") + "</div>";
    return '<div class="view"><div class="liga-head" style="background:linear-gradient(135deg,' + c[0] + "," + c[3] + ')"><div><h2>' + esc(isAll ? "Alle Artikel" : LIGA_MENU[ligaSel][0]) + "</h2><p>" + list.length + " Artikel" + (isAll ? " aus allen Ligen" : "") + "</p></div>" + links + "</div>" +
      (list.length ? "" : '<div class="card empty">Hier gibt es noch keine Artikel. Schau bald wieder vorbei!</div>') +
      (neu.length ? '<section class="sec"><div class="sec-h"><h2>Aktuell</h2></div><div class="grid">' + neu.map(n => newsCard(n)).join("") + "</div></section>" : "") +
      Object.keys(groups).map(k => '<section class="sec"><div class="sec-h"><h2>' + esc(k) + '</h2><p>aus dem Archiv</p></div><div class="grid">' + groups[k].map(n => newsCard(n)).join("") + "</div></section>").join("") + "</div>";
  }
  const VIEWS = { heute: vHeute, ergebnisse: vErgebnisse, upcoming: vUpcoming, tabellen: vTabellen, training: vTraining, quiz: vQuiz, statistik: vStatistik, liga: vLiga };

  function render() {
    $("#tabs").innerHTML = TABS.map(t => '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === current) + '"><svg viewBox="0 0 32 32" aria-hidden="true">' + t.icon + "</svg>" + t.label + "</button>").join("");
    if (!D) return;
    $("#main").innerHTML = VIEWS[current]();
  }
  function go(id) { if (!VIEWS[id]) id = "heute"; current = id;
    // Einen alten Sprung wie #liga-NBA entfernen, damit Neuladen nicht dorthin zurückführt
    if (location.hash && location.hash.slice(1) !== id) history.replaceState(null, "", location.pathname + location.search); store.set("tab", id); store.set("liga", ligaSel); render(); window.scrollTo(0, 0); }

  function articleBody(n) {
    return '<div class="meta">' + ligaPill(n.liga) + (n.lang === "en" ? '<span class="pill en">English</span>' : "") + "<span>" + fmtDate(n.datum) + "</span></div><h1>" + esc(n.titel) + '</h1><div class="body">' + (n.text || []).map(p => "<p>" + linkTerms(p) + "</p>").join("") + "</div>" +
      (n.fakten && n.fakten.length ? '<div class="facts"><h4>' + (n.lang === "en" ? "Quick facts" : "Das Wichtigste") + "</h4><ul>" + n.fakten.map(f => "<li>" + esc(f) + "</li>").join("") + "</ul></div>" : "") +
      (n.vokabeln && n.vokabeln.length ? '<div class="vocab"><h4>Vokabeln</h4><dl>' + n.vokabeln.map(v => "<dt>" + esc(v.en) + "</dt><dd>" + esc(v.de) + "</dd>").join("") + "</dl></div>" : "") +
      '<p class="src">Zusammengefasst nach: ' + esc((n.quellen || []).join(", ")) + "</p>";
  }
  function openNews(id) {
    const n = allNews().find(x => x.id === id); if (!n) return;
    $("#overlay").innerHTML = '<div class="reader" role="dialog" aria-modal="true" aria-label="' + esc(n.titel) + '"><div class="reader-bar"><button data-close><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>Zurück</button></div><article>' +
      '<div class="art">' + art(n.motiv, n.liga) + "</div>" + articleBody(n) + "</article></div>";
    document.body.style.overflow = "hidden";
    $("[data-close]").focus();
  }
  function closeNews() { $("#overlay").innerHTML = ""; document.body.style.overflow = ""; }
  function showTerm(t) {
    const x = (D.lexikon || []).find(l => l.begriff.toLowerCase() === t.toLowerCase()); if (!x) return;
    const old = $(".sheet"); if (old) old.remove();
    const el = document.createElement("div"); el.className = "sheet";
    el.innerHTML = '<div class="sheet-in" role="dialog" aria-label="Begriff"><b>' + esc(x.begriff) + "</b>" + (x.en ? '<span class="en">Englisch: ' + esc(x.en) + "</span>" : "") + "<span>" + esc(x.erklaerung) + '</span><button data-sheet-close>Verstanden</button></div>';
    document.body.appendChild(el);
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.favTeam || b.dataset.favSpieler) { toggleFav(b.dataset.favTeam, b.dataset.favSpieler); render(); }
    else if (b.dataset.tab) go(b.dataset.tab);
    else if (b.dataset.liga) { ligaSel = b.dataset.liga; go("liga"); }
    else if (b.dataset.gotoRes) { resFilter = b.dataset.gotoRes; go("ergebnisse"); }
    else if (b.dataset.gotoUp) { upFilter = b.dataset.gotoUp; go("upcoming"); }
    else if (b.dataset.up) { upFilter = b.dataset.up; render(); }
    else if (b.dataset.gotoTbl) { tblFilter = b.dataset.gotoTbl; go("tabellen"); }
    else if (b.dataset.news) openNews(b.dataset.news);
    else if (b.dataset.game != null) openGame(Number(b.dataset.game));
    else if (b.hasAttribute("data-close")) closeNews();
    else if (b.dataset.t) showTerm(b.dataset.t);
    else if (b.hasAttribute("data-sheet-close")) b.closest(".sheet").remove();
    else if (b.dataset.res) { resFilter = b.dataset.res; render(); }
    else if (b.dataset.tbl) { tblFilter = b.dataset.tbl; render(); }
    else if (b.dataset.stSort) { if (stSort === b.dataset.stSort) stDir = -stDir; else { stSort = b.dataset.stSort; stDir = -1; } stLimit = 50; render(); }
    else if (b.hasAttribute("data-st-saison")) loadSaison(b.dataset.stSaison);
    else if (b.dataset.stFilter) { stFilter = b.dataset.stFilter; render(); }
    else if (b.dataset.stAll) { stAll = !stAll; render(); }
    else if (b.hasAttribute("data-st-more")) { stLimit += 50; render(); }
    else if (b.dataset.schiri != null) {
      const key = "schiri_" + ((D.schiri || {}).id || D.aktualisiert);
      if (store.get(key, null) == null) { store.set(key, Number(b.dataset.schiri)); render(); }
    }
    else if (b.dataset.ans != null || b.dataset.quiz) {
      const key = "quiz_" + (D.quizId || D.aktualisiert), st = store.get(key, { i: 0, picks: [] });
      if (b.dataset.ans != null && st.picks.length === st.i) st.picks.push(Number(b.dataset.ans));
      else if (b.dataset.quiz === "next") st.i++;
      else if (b.dataset.quiz === "reset") { st.i = 0; st.picks = []; }
      store.set(key, st); render();
    }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "st-saison") loadSaison(e.target.value);
  });
  document.addEventListener("input", e => {
    if (e.target.id === "stq") { stQuery = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#stq"); i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { const s = $(".sheet"); if (s) s.remove(); else closeNews(); } });

  const h = (location.hash || "").slice(1);
  if (/^liga-/i.test(h)) { current = "liga"; ligaSel = h.slice(5).toUpperCase(); }
  else { current = VIEWS[h] ? h : store.get("tab", "heute"); ligaSel = store.get("liga", "ALLE"); }
  if (current === "lexikon") current = "statistik"; // früherer Tab, ersetzt durch die NBA-Statistik
  if (current === "stars") current = "training"; // früherer Tab, ersetzt durch Training
  if (current === "liga" && !/^liga-/i.test(h)) current = "heute"; // Liga-Seiten gibt es nur noch über einen direkten Link (#liga-NBA)
  if (!VIEWS[current]) current = "heute";
  window.addEventListener("hashchange", () => { const x = location.hash.slice(1); if (/^liga-/i.test(x)) { ligaSel = x.slice(5).toUpperCase(); go("liga"); } else if (VIEWS[x]) go(x); });
  render();
  fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    D = d;
    $("#stamp").innerHTML = "<strong>" + esc(d.ausgabe || "Aktuelle Ausgabe") + "</strong>Stand: " + fmtDate(d.aktualisiert, true);
    render();
    // Das Archiv ist optional: fehlt es, zeigt die App einfach nur die aktuellen Artikel.
    fetch("archiv.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(a => { if (a && Array.isArray(a.news)) { A = a.news; render(); } }).catch(() => {});
    fetch("nba-stats.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(s => { if (s && Array.isArray(s.spieler)) { S = s; if (["statistik", "ergebnisse"].includes(current)) render(); } }).catch(() => {});
    fetch("nba-stats-saisons.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(x => { if (x && Array.isArray(x.vergangen)) { SX = x.vergangen; if (current === "statistik") render(); } }).catch(() => {});
  }).catch(() => { $("#main").innerHTML = '<div class="card empty">Die News konnten gerade nicht geladen werden. Prüfe das Internet und lade die Seite neu.</div>'; $("#stamp").innerHTML = "<strong>Offline</strong>"; });
})();
</script>
</body>
</html>
